<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Qelvora product overview</title>
  <desc id="desc">A polished product overview showing Qelvora correcting selected text on macOS with a local result panel.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E5EDF7"/>
    </linearGradient>
    <linearGradient id="appIcon" x1="92" y1="100" x2="178" y2="186" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B84FF"/>
      <stop offset="1" stop-color="#16C6D8"/>
    </linearGradient>
    <linearGradient id="panel" x1="640" y1="140" x2="1240" y2="594" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27272A"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1440" height="900" rx="38" fill="url(#page)"/>
  <rect x="64" y="62" width="1312" height="776" rx="34" fill="white" stroke="#D7DFEA" stroke-width="2" filter="url(#shadow)"/>

  <rect x="64" y="62" width="1312" height="72" rx="34" fill="#F8FAFC"/>
  <circle cx="104" cy="98" r="11" fill="#FF5F57"/>
  <circle cx="138" cy="98" r="11" fill="#FFBD2E"/>
  <circle cx="172" cy="98" r="11" fill="#28C840"/>
  <rect x="236" y="86" width="220" height="24" rx="12" fill="#EEF2F7"/>
  <rect x="1088" y="86" width="52" height="24" rx="12" fill="#EEF2F7"/>
  <rect x="1152" y="86" width="52" height="24" rx="12" fill="#EEF2F7"/>
  <rect x="1216" y="86" width="96" height="24" rx="12" fill="#0B84FF" opacity="0.12"/>

  <g transform="translate(96 176)">
    <text class="font" x="0" y="0" fill="#111827" font-size="30" font-weight="800">Draft anywhere</text>
    <text class="font" x="0" y="44" fill="#475569" font-size="22" font-weight="500">Select text in Chrome, Discord, Notes, editors, or any app.</text>
    <rect x="0" y="86" width="548" height="276" rx="28" fill="#F8FAFC" stroke="#DCE4EF" stroke-width="2"/>
    <text class="font" x="36" y="140" fill="#111827" font-size="28" font-weight="750">I want to ship this message fast</text>
    <text class="font" x="36" y="184" fill="#111827" font-size="28" font-weight="750">but it still needs clean grammar</text>
    <rect x="36" y="214" width="468" height="48" rx="10" fill="#B8D7FF"/>
    <text class="font" x="48" y="246" fill="#0F172A" font-size="26" font-weight="650">this sentense need a clean correction</text>
    <rect x="36" y="292" width="196" height="40" rx="20" fill="#E8F3FF"/>
    <text class="font" x="66" y="318" fill="#0B63CE" font-size="18" font-weight="800">Selected text</text>
  </g>

  <g transform="translate(620 120)">
    <rect x="0" y="0" width="674" height="474" rx="34" fill="url(#panel)" stroke="#525252" stroke-width="2" filter="url(#shadow)"/>
    <rect x="34" y="34" width="72" height="72" rx="18" fill="url(#appIcon)"/>
    <path d="M72 48c-16 16-23 37-15 58 21-8 40-29 47-58-10-3-22-3-32 0Z" fill="white"/>
    <path d="M65 94c12-11 21-23 29-38" stroke="#0EA5E9" stroke-width="3.6" stroke-linecap="round"/>
    <text class="font" x="126" y="64" fill="#FAFAFA" font-size="34" font-weight="850">Correction ready</text>
    <text class="font" x="126" y="96" fill="#A3A3A3" font-size="18" font-weight="700">Local result · English detected</text>
    <rect x="500" y="34" width="122" height="52" rx="15" fill="#0B84FF"/>
    <text class="font" x="538" y="68" fill="white" font-size="20" font-weight="850">Copy</text>

    <g transform="translate(34 132)">
      <rect x="0" y="0" width="118" height="42" rx="21" fill="#14351F"/>
      <text class="font" x="27" y="28" fill="#4ADE80" font-size="17" font-weight="850">96% right</text>
      <rect x="132" y="0" width="112" height="42" rx="21" fill="#343434"/>
      <text class="font" x="163" y="28" fill="#D4D4D4" font-size="17" font-weight="800">7 words</text>
      <rect x="258" y="0" width="136" height="42" rx="21" fill="#2B1B1B"/>
      <text class="font" x="286" y="28" fill="#FF6B6B" font-size="17" font-weight="850">1 correction</text>
    </g>

    <text class="font" x="34" y="242" fill="#F5F5F5" font-size="30" font-weight="740">This sentence needs a clean correction.</text>
    <line x1="34" y1="300" x2="640" y2="300" stroke="#444" stroke-width="2"/>
    <text class="font" x="34" y="342" fill="#A3A3A3" font-size="18" font-weight="800">Errors found</text>
    <rect x="34" y="366" width="606" height="68" rx="18" fill="#18181B" stroke="#5F2323" stroke-width="2"/>
    <text class="font" x="58" y="408" fill="#F5F5F5" font-size="21" font-weight="650">this</text>
    <text class="font" x="108" y="408" fill="#FF5757" font-size="21" font-weight="800" text-decoration="underline">sentense</text>
    <text class="font" x="212" y="408" fill="#F5F5F5" font-size="21" font-weight="650">need a clean correction</text>
  </g>

  <g transform="translate(96 608)">
    <rect x="0" y="0" width="382" height="130" rx="26" fill="#0F172A"/>
    <text class="font" x="32" y="45" fill="#E5E7EB" font-size="23" font-weight="850">Private by default</text>
    <text class="font" x="32" y="82" fill="#94A3B8" font-size="18" font-weight="600">Text is corrected through your local Ollama model.</text>
    <circle cx="332" cy="48" r="20" fill="#22C55E" opacity="0.18"/>
    <path d="M323 48l7 7 14-17" stroke="#4ADE80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(530 608)">
    <rect x="0" y="0" width="382" height="130" rx="26" fill="#0F172A"/>
    <text class="font" x="32" y="45" fill="#E5E7EB" font-size="23" font-weight="850">Works across apps</text>
    <text class="font" x="32" y="82" fill="#94A3B8" font-size="18" font-weight="600">Clipboard first, OCR fallback when selection APIs fail.</text>
    <circle cx="332" cy="48" r="20" fill="#0EA5E9" opacity="0.18"/>
    <path d="M322 50h22m-8-8 8 8-8 8" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(964 608)">
    <rect x="0" y="0" width="382" height="130" rx="26" fill="#0F172A"/>
    <text class="font" x="32" y="45" fill="#E5E7EB" font-size="23" font-weight="850">Correct or translate</text>
    <text class="font" x="32" y="82" fill="#94A3B8" font-size="18" font-weight="600">Switch the result to French, English, Chinese, Japanese, and more.</text>
    <text class="font" x="305" y="56" fill="#FDE68A" font-size="28" font-weight="900">EN</text>
  </g>
</svg>
