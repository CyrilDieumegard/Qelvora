<svg width="1120" height="300" viewBox="0 0 1120 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Qelvora local correction workflow</title>
  <desc id="desc">Diagram showing text selection, local capture, Ollama correction, and corrected result.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1688ff"/>
      <stop offset="1" stop-color="#08c4d8"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="300" rx="28" fill="#111827"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="58" y="72" width="210" height="156" rx="22" fill="#1F2937" stroke="#374151"/>
    <text x="92" y="122" fill="#F9FAFB" font-size="24" font-weight="800">Select</text>
    <text x="92" y="158" fill="#9CA3AF" font-size="17" font-weight="600">Choose text in any</text>
    <text x="92" y="184" fill="#9CA3AF" font-size="17" font-weight="600">macOS application.</text>
    <rect x="319" y="72" width="210" height="156" rx="22" fill="#1F2937" stroke="#374151"/>
    <text x="353" y="122" fill="#F9FAFB" font-size="24" font-weight="800">Capture</text>
    <text x="353" y="158" fill="#9CA3AF" font-size="17" font-weight="600">Clipboard first, OCR</text>
    <text x="353" y="184" fill="#9CA3AF" font-size="17" font-weight="600">fallback if needed.</text>
    <rect x="580" y="72" width="210" height="156" rx="22" fill="#1F2937" stroke="#374151"/>
    <text x="614" y="122" fill="#F9FAFB" font-size="24" font-weight="800">Correct</text>
    <text x="614" y="158" fill="#9CA3AF" font-size="17" font-weight="600">Send to the local</text>
    <text x="614" y="184" fill="#9CA3AF" font-size="17" font-weight="600">Ollama model.</text>
    <rect x="841" y="72" width="210" height="156" rx="22" fill="#1F2937" stroke="#374151"/>
    <text x="875" y="122" fill="#F9FAFB" font-size="24" font-weight="800">Use</text>
    <text x="875" y="158" fill="#9CA3AF" font-size="17" font-weight="600">Copy, replace, or</text>
    <text x="875" y="184" fill="#9CA3AF" font-size="17" font-weight="600">translate the result.</text>
    <path d="M282 150H305" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/>
    <path d="M305 150L296 141M305 150L296 159" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/>
    <path d="M543 150H566" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/>
    <path d="M566 150L557 141M566 150L557 159" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/>
    <path d="M804 150H827" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/>
    <path d="M827 150L818 141M827 150L818 159" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/>
    <rect x="444" y="246" width="232" height="34" rx="17" fill="#052E1A"/>
    <text x="476" y="269" fill="#4ADE80" font-size="16" font-weight="800">Private by default</text>
  </g>
</svg>
