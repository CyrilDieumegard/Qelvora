<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Qelvora macOS correction panel preview</title>
  <desc id="desc">A polished dark macOS style preview showing Qelvora correcting selected text locally.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.45" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brand" x1="84" y1="94" x2="166" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1688ff"/>
      <stop offset="1" stop-color="#08c4d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1048" cy="92" r="170" fill="#0EA5E9" opacity="0.14"/>
  <circle cx="188" cy="530" r="210" fill="#22C55E" opacity="0.09"/>
  <rect x="80" y="86" width="1120" height="468" rx="30" fill="#171717" stroke="#343434" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="86" width="1120" height="72" rx="30" fill="#1f1f1f"/>
  <circle cx="118" cy="122" r="12" fill="#ff5f57"/>
  <circle cx="152" cy="122" r="12" fill="#ffbd2e"/>
  <circle cx="186" cy="122" r="12" fill="#2f80ff"/>
  <rect x="104" y="196" width="512" height="308" rx="24" fill="#202020" stroke="#343434" stroke-width="2"/>
  <rect x="132" y="224" width="82" height="82" rx="22" fill="url(#brand)"/>
  <path d="M176 246c-18 18-25 41-17 63 23-8 45-31 53-64-11-3-25-3-36 1Z" fill="white"/>
  <path d="M168 294c13-12 24-25 32-42" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
  <text x="238" y="253" fill="#F9FAFB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="800">Qelvora</text>
  <text x="238" y="288" fill="#A3A3A3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">Local writing correction for macOS</text>
  <rect x="132" y="350" width="428" height="54" rx="18" fill="#0B84FF"/>
  <text x="242" y="384" fill="white" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="750">Correct selected text</text>
  <rect x="132" y="422" width="198" height="40" rx="20" fill="#14351f"/>
  <circle cx="158" cy="442" r="10" fill="#22C55E"/>
  <text x="180" y="449" fill="#2F80FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750">Ready</text>
  <rect x="646" y="138" width="490" height="340" rx="28" fill="#262626" stroke="#575757" stroke-width="2"/>
  <text x="686" y="190" fill="#F9FAFB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="800">Correction ready</text>
  <rect x="984" y="158" width="112" height="44" rx="14" fill="#0B84FF"/>
  <text x="1014" y="187" fill="white" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750">Copy</text>
  <text x="686" y="248" fill="#F5F5F5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650">
    <tspan x="686" dy="0">I will send the clean version,</tspan>
    <tspan x="686" dy="34">with the same structure and tone.</tspan>
  </text>
  <rect x="686" y="322" width="126" height="38" rx="19" fill="#14351f"/>
  <text x="712" y="347" fill="#2F80FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="800">96% right</text>
  <rect x="826" y="322" width="112" height="38" rx="19" fill="#333333"/>
  <text x="854" y="347" fill="#D4D4D4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="750">18 words</text>
  <line x1="686" y1="394" x2="1096" y2="394" stroke="#454545" stroke-width="2"/>
  <text x="686" y="432" fill="#A3A3A3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750">OCR diagnostic</text>
  <text x="686" y="464" fill="#737373" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">Selected text is captured locally before correction.</text>
</svg>
